<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Tide widget</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .tide-widget { max-width: none !important; border-radius: 0; }
</style>
</head>
<body>
<div class="tide-widget" data-station="{{ slug }}" data-days="{{ days }}" data-theme="{{ theme }}" data-units="{{ units }}" data-spd="{{ spd }}"></div>
<script src="/widget.js"></script>
</body>
</html>
