<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="/static/css/styles.css" rel="stylesheet"/>
<link crossorigin="" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" rel="stylesheet"/>
<script crossorigin="" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" rel="stylesheet"/>
<link href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" rel="stylesheet"/>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="/static/js/suche.js" defer></script>
<script src="/static/js/wave_layer.js" defer></script>
<script src="/static/js/precip_layer.js" defer></script>
<script src="/static/js/sst_layer.js" defer></script>

<title>TideWise - Tide predictions &amp; forecasts</title>
</head>
<body>
<script>
  if (window.performance && performance.getEntriesByType("navigation")[0].type === "back_forward") {
    location.reload();
  }
</script>

<div id="map"></div>
<button id="search-trigger" type="button">Search for locations</button>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    console.log("🌍 DOM geladen. Initialisiere Leaflet-Karte...");

    const savedView = JSON.parse(localStorage.getItem('mapView'));
    console.log("📦 localStorage mapView:", savedView);

    const defaultLatLng = [44.9672, -103.7715];
    const defaultZoom = 4;

    const map = L.map('map', {
      worldCopyJump: true,
      maxBoundsViscosity: 1.0,
      maxBounds: [[-90, -180], [90, 180]],
      zoomControl: false
    }).setView(
      savedView && savedView.center ? savedView.center : defaultLatLng,
      savedView && typeof savedView.zoom === 'number' ? savedView.zoom : defaultZoom
    );

    // --- Locate button (above zoom) ---
    const LocateControl = L.Control.extend({
      options: { position: 'bottomleft' },
      onAdd: function () {
        const btn = L.DomUtil.create('div', 'leaflet-bar');
        btn.innerHTML = '<a href="#" title="Mein Standort" style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;font-size:18px;text-decoration:none;color:#333;">&#x2316;</a>';
        L.DomEvent.disableClickPropagation(btn);
        btn.querySelector('a').addEventListener('click', function (e) {
          e.preventDefault();
          map.locate({ setView: true, maxZoom: 12 });
        });
        return btn;
      }
    });
    new LocateControl().addTo(map);

    // Zoom buttons bottom-left
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    const basemap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // --- RainViewer Radar-Animation (letzte 2h, alle 10 Min) ---
    const RADAR_OPACITY = 0.6;
    const ANIMATION_DELAY = 1000;
    let rvApiData = {};
    let rvFrames = [];
    let rvPosition = 0;
    let rvTimer = null;
    let rvLayerCache = {};
    let rvCurrentLayer = null;
    let rvLoading = false;
    let rvActive = false;

    function rvFormatTime(ts) {
      const d = new Date(ts * 1000);
      return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' +
             d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    }

    function rvCreateLayer(frame) {
      return L.tileLayer(rvApiData.host + frame.path + '/256/{z}/{x}/{y}/2/1_1.png', {
        tileSize: 256,
        opacity: 0.001,
        maxNativeZoom: 7,
        maxZoom: 18,
        zIndex: 1000
      });
    }

    function rvShowFrame(pos) {
      if (rvLoading || rvFrames.length === 0) return;
      pos = ((pos % rvFrames.length) + rvFrames.length) % rvFrames.length;
      const frame = rvFrames[pos];

      // Zeitanzeige aktualisieren
      const tsEl = document.getElementById('rv-timestamp');
      if (tsEl) tsEl.textContent = rvFormatTime(frame.time);

      // Fortschrittsbalken
      const progEl = document.getElementById('rv-progress');
      if (progEl) progEl.value = pos;

      const oldLayer = rvCurrentLayer;

      if (rvLayerCache[pos]) {
        if (oldLayer) oldLayer.setOpacity(0);
        rvLayerCache[pos].setOpacity(RADAR_OPACITY);
        rvCurrentLayer = rvLayerCache[pos];
        rvPosition = pos;
        if (rvTimer !== null) rvTimer = setTimeout(rvPlay, ANIMATION_DELAY);
        return;
      }

      rvLoading = true;
      const newLayer = rvCreateLayer(frame);
      newLayer.on('load', function () {
        newLayer.setOpacity(RADAR_OPACITY);
        if (oldLayer) oldLayer.setOpacity(0);
        rvLayerCache[pos] = newLayer;
        rvCurrentLayer = newLayer;
        rvPosition = pos;
        rvLoading = false;
        if (rvTimer !== null) rvTimer = setTimeout(rvPlay, ANIMATION_DELAY);
      });
      newLayer.addTo(map);
    }

    function rvPlay() {
      rvTimer = true;
      document.getElementById('rv-play-btn').textContent = '\u23F8';
      rvShowFrame(rvPosition + 1);
    }

    function rvStop() {
      if (rvTimer !== null && rvTimer !== false) {
        clearTimeout(rvTimer);
        rvTimer = null;
        document.getElementById('rv-play-btn').textContent = '\u25B6';
        return true;
      }
      return false;
    }

    function rvPlayStop() {
      if (!rvStop()) rvPlay();
    }

    function rvClearCache() {
      rvStop();
      for (var p in rvLayerCache) {
        map.removeLayer(rvLayerCache[p]);
      }
      rvLayerCache = {};
      rvCurrentLayer = null;
    }

    function rvToggle(on) {
      rvActive = on;
      const panel = document.getElementById('rv-controls');
      if (on) {
        panel.style.display = 'flex';
        rvLoadApi();
      } else {
        panel.style.display = 'none';
        rvStop();
        rvClearCache();
      }
    }

    function rvLoadApi() {
      fetch('https://api.rainviewer.com/public/weather-maps.json')
        .then(res => res.json())
        .then(data => {
          rvApiData = data;
          rvClearCache();
          rvFrames = data.radar.past || [];
          rvPosition = 0;
          const progEl = document.getElementById('rv-progress');
          if (progEl) { progEl.max = rvFrames.length - 1; progEl.value = 0; }
          rvShowFrame(rvFrames.length - 1);
        })
        .catch(err => console.warn('RainViewer API error:', err));
    }

    // Alle 5 Min neu laden wenn aktiv
    setInterval(function () { if (rvActive) rvLoadApi(); }, 5 * 60 * 1000);

    // Layer-Control (DWD static layer removed — replaced by Nowcast animation below)

    // --- Radar Nowcast Animation (DWD Deutschland + KNMI Niederlande, -30min..+2h, 5-min steps) ---
    let ncFrames = [];
    let ncPosition = 0;
    let ncTimer = null;
    let ncLayerCache = {};       // pos -> [dwdLayer, knmiLayer]
    let ncCurrentLayers = null;  // array of active layers
    let ncLoading = false;
    let ncActive = false;

    function ncBuildFrames() {
      const now = new Date();
      now.setMinutes(Math.floor(now.getMinutes() / 5) * 5, 0, 0);
      const frames = [];
      for (let m = -30; m <= 120; m += 5) {
        const t = new Date(now.getTime() + m * 60000);
        frames.push({
          time: t.toISOString().replace(/\.\d{3}Z$/, '.000Z'),
          offset: m,
          isForecast: m > 0
        });
      }
      return frames;
    }

    function ncFormatLabel(frame) {
      const d = new Date(frame.time);
      const dateStr = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
      const timeStr = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      const tag = frame.isForecast ? ' (Vorhersage)' : '';
      return dateStr + ' ' + timeStr + tag;
    }

    function ncCreateLayers(frame) {
      var dwd = L.tileLayer.wms('https://maps.dwd.de/geoserver/dwd/wms?', {
        layers: 'dwd:Niederschlagsradar',
        transparent: true,
        format: 'image/png',
        time: frame.time,
        opacity: 0.001,
        maxZoom: 18,
        zIndex: 1001
      });
      var knmi = L.tileLayer.wms('https://anonymous.api.dataplatform.knmi.nl/wms/adaguc-server?DATASET=radar_forecast_2.0&SERVICE=WMS', {
        layers: 'precipitation_nowcast',
        transparent: true,
        format: 'image/png',
        time: frame.time,
        opacity: 0.001,
        maxZoom: 18,
        zIndex: 1001
      });
      return [dwd, knmi];
    }

    function ncSetOpacity(layers, op) {
      if (!layers) return;
      for (var i = 0; i < layers.length; i++) layers[i].setOpacity(op);
    }

    function ncShowFrame(pos) {
      if (ncLoading || ncFrames.length === 0) return;
      pos = ((pos % ncFrames.length) + ncFrames.length) % ncFrames.length;
      const frame = ncFrames[pos];

      const tsEl = document.getElementById('nc-timestamp');
      if (tsEl) tsEl.textContent = ncFormatLabel(frame);
      if (tsEl) tsEl.style.color = frame.isForecast ? '#e07000' : '#333';

      const progEl = document.getElementById('nc-progress');
      if (progEl) progEl.value = pos;

      const oldLayers = ncCurrentLayers;

      if (ncLayerCache[pos]) {
        ncSetOpacity(oldLayers, 0);
        ncSetOpacity(ncLayerCache[pos], 0.7);
        ncCurrentLayers = ncLayerCache[pos];
        ncPosition = pos;
        if (ncTimer !== null) ncTimer = setTimeout(ncPlay, 600);
        return;
      }

      ncLoading = true;
      const newLayers = ncCreateLayers(frame);
      var loadCount = 0;
      function onLayerLoad() {
        loadCount++;
        if (loadCount < newLayers.length) return;
        ncSetOpacity(newLayers, 0.7);
        ncSetOpacity(oldLayers, 0);
        ncLayerCache[pos] = newLayers;
        ncCurrentLayers = newLayers;
        ncPosition = pos;
        ncLoading = false;
        if (ncTimer !== null) ncTimer = setTimeout(ncPlay, 600);
      }
      for (var i = 0; i < newLayers.length; i++) {
        newLayers[i].on('load', onLayerLoad);
        newLayers[i].addTo(map);
      }
    }

    function ncPlay() {
      ncTimer = true;
      document.getElementById('nc-play-btn').textContent = '\u23F8';
      ncShowFrame(ncPosition + 1);
    }

    function ncStop() {
      if (ncTimer !== null && ncTimer !== false) {
        clearTimeout(ncTimer);
        ncTimer = null;
        document.getElementById('nc-play-btn').textContent = '\u25B6';
        return true;
      }
      return false;
    }

    function ncPlayStop() { if (!ncStop()) ncPlay(); }

    function ncClearCache() {
      ncStop();
      for (var p in ncLayerCache) {
        for (var i = 0; i < ncLayerCache[p].length; i++) map.removeLayer(ncLayerCache[p][i]);
      }
      ncLayerCache = {};
      ncCurrentLayers = null;
    }

    function ncToggle(on) {
      ncActive = on;
      const panel = document.getElementById('nc-controls');
      if (on) {
        panel.style.display = 'flex';
        ncFrames = ncBuildFrames();
        const progEl = document.getElementById('nc-progress');
        if (progEl) { progEl.max = ncFrames.length - 1; progEl.value = 0; }
        const nowIdx = ncFrames.findIndex(f => f.offset === 0);
        ncShowFrame(nowIdx >= 0 ? nowIdx : 0);
      } else {
        panel.style.display = 'none';
        ncClearCache();
      }
    }

    setInterval(function () {
      if (ncActive) {
        ncClearCache();
        ncFrames = ncBuildFrames();
        const progEl = document.getElementById('nc-progress');
        if (progEl) { progEl.max = ncFrames.length - 1; }
        const nowIdx = ncFrames.findIndex(f => f.offset === 0);
        ncShowFrame(nowIdx >= 0 ? nowIdx : 0);
      }
    }, 5 * 60 * 1000);

    // --- Nowcast Control Panel ---
    const NowcastControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function () {
        const container = L.DomUtil.create('div', 'leaflet-bar');
        container.style.cssText = 'background:#fff;padding:8px 12px;border-radius:6px;font-family:sans-serif;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.3);user-select:none;';
        container.innerHTML =
          '<div style="margin-bottom:6px;font-weight:bold;">' +
            '<label style="cursor:pointer;">' +
              '<input type="checkbox" id="nc-toggle" style="margin-right:5px;"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px;margin-right:3px;"><path d="M4 13.5A4.5 4.5 0 0 1 8.5 9h.3A5.5 5.5 0 0 1 19 10.5a3.5 3.5 0 0 1-.5 7H5a4.5 4.5 0 0 1-1-4z" fill="#888"/><circle cx="14" cy="20" r="1.5" fill="#555"/><path d="M10.5 18.5a5 5 0 0 1 7 0" stroke="#555" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M8.5 16.5a8 8 0 0 1 11 0" stroke="#555" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>Radar-Nowcast DE+NL (-30min..+2h)' +
            '</label>' +
          '</div>' +
          '<div id="nc-controls" style="display:none;flex-direction:column;align-items:center;gap:6px;">' +
            '<div style="display:flex;align-items:center;gap:8px;">' +
              '<button id="nc-prev-btn" style="font-size:16px;cursor:pointer;border:none;background:none;padding:2px 6px;">\u23EE</button>' +
              '<button id="nc-play-btn" style="font-size:18px;cursor:pointer;border:none;background:none;padding:2px 8px;">\u25B6</button>' +
              '<button id="nc-next-btn" style="font-size:16px;cursor:pointer;border:none;background:none;padding:2px 6px;">\u23ED</button>' +
            '</div>' +
            '<span id="nc-timestamp" style="min-width:180px;text-align:center;font-weight:bold;font-size:12px;">--</span>' +
            '<input type="range" id="nc-progress" min="0" max="30" value="0" style="width:180px;cursor:pointer;">' +
            '<div style="font-size:10px;color:#888;">Quellen: DWD (1km) + KNMI (1km)</div>' +
          '</div>';

        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        setTimeout(function () {
          document.getElementById('nc-toggle').addEventListener('change', function () {
            ncToggle(this.checked);
          });
          document.getElementById('nc-play-btn').addEventListener('click', ncPlayStop);
          document.getElementById('nc-prev-btn').addEventListener('click', function () {
            ncStop(); ncShowFrame(ncPosition - 1);
          });
          document.getElementById('nc-next-btn').addEventListener('click', function () {
            ncStop(); ncShowFrame(ncPosition + 1);
          });
          document.getElementById('nc-progress').addEventListener('input', function () {
            ncStop(); ncShowFrame(parseInt(this.value));
          });
        }, 0);

        return container;
      }
    });
    // --- Radar-Animation Controls (Custom Leaflet Control) ---
    const RadarControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function () {
        const container = L.DomUtil.create('div', 'leaflet-bar');
        container.style.cssText = 'background:#fff;padding:8px 12px;border-radius:6px;font-family:sans-serif;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.3);user-select:none;';
        container.innerHTML =
          '<div style="margin-bottom:6px;font-weight:bold;">' +
            '<label style="cursor:pointer;">' +
              '<input type="checkbox" id="rv-toggle" style="margin-right:5px;"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px;margin-right:3px;"><path d="M4 13.5A4.5 4.5 0 0 1 8.5 9h.3A5.5 5.5 0 0 1 19 10.5a3.5 3.5 0 0 1-.5 7H5a4.5 4.5 0 0 1-1-4z" fill="#888"/><circle cx="14" cy="20" r="1.5" fill="#555"/><path d="M10.5 18.5a5 5 0 0 1 7 0" stroke="#555" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M8.5 16.5a8 8 0 0 1 11 0" stroke="#555" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>Regenradar Animation' +
            '</label>' +
          '</div>' +
          '<div id="rv-controls" style="display:none;flex-direction:column;align-items:center;gap:6px;">' +
            '<div style="display:flex;align-items:center;gap:8px;">' +
              '<button id="rv-prev-btn" style="font-size:16px;cursor:pointer;border:none;background:none;padding:2px 6px;">\u23EE</button>' +
              '<button id="rv-play-btn" style="font-size:18px;cursor:pointer;border:none;background:none;padding:2px 8px;">\u25B6</button>' +
              '<button id="rv-next-btn" style="font-size:16px;cursor:pointer;border:none;background:none;padding:2px 6px;">\u23ED</button>' +
              '<span id="rv-timestamp" style="min-width:100px;text-align:center;font-weight:bold;">--.--.--:--</span>' +
            '</div>' +
            '<input type="range" id="rv-progress" min="0" max="11" value="0" style="width:180px;cursor:pointer;">' +
          '</div>';

        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        setTimeout(function () {
          document.getElementById('rv-toggle').addEventListener('change', function () {
            rvToggle(this.checked);
          });
          document.getElementById('rv-play-btn').addEventListener('click', rvPlayStop);
          document.getElementById('rv-prev-btn').addEventListener('click', function () {
            rvStop(); rvShowFrame(rvPosition - 1);
          });
          document.getElementById('rv-next-btn').addEventListener('click', function () {
            rvStop(); rvShowFrame(rvPosition + 1);
          });
          document.getElementById('rv-progress').addEventListener('input', function () {
            rvStop(); rvShowFrame(parseInt(this.value));
          });
        }, 0);

        return container;
      }
    });
    // --- Wave Forecast Layer (Canvas) ---
    const waveLayer = new WaveCanvasLayer(map);

    const WaveControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function () {
        const container = L.DomUtil.create('div', 'leaflet-bar');
        container.style.cssText = 'background:#fff;padding:8px 12px;border-radius:6px;font-family:sans-serif;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.3);user-select:none;';
        container.innerHTML =
          '<div style="margin-bottom:6px;font-weight:bold;">' +
            '<label style="cursor:pointer;">' +
              '<input type="checkbox" id="wv-toggle" style="margin-right:5px;"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px;margin-right:3px;"><path d="M2 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0" stroke="#555" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M2 18c2-3 4-3 6 0s4 3 6 0 4-3 6 0" stroke="#555" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/></svg>Wellenvorhersage (GFS-Wave)' +
            '</label>' +
          '</div>' +
          '<div id="wv-controls" style="display:none;flex-direction:column;align-items:center;gap:6px;">' +
            '<div id="wv-loading" style="color:#888;">Lade Daten...</div>' +
            '<div id="wv-player" style="display:none;">' +
              '<div style="display:flex;align-items:center;gap:8px;">' +
                '<button id="wv-prev-btn" style="font-size:16px;cursor:pointer;border:none;background:none;padding:2px 6px;">\u23EE</button>' +
                '<button id="wv-play-btn" style="font-size:18px;cursor:pointer;border:none;background:none;padding:2px 8px;">\u25B6</button>' +
                '<button id="wv-next-btn" style="font-size:16px;cursor:pointer;border:none;background:none;padding:2px 6px;">\u23ED</button>' +
                '<span id="wv-label" style="min-width:140px;text-align:center;font-weight:bold;">--</span>' +
              '</div>' +
              '<input type="range" id="wv-progress" min="0" max="8" value="0" style="width:180px;cursor:pointer;">' +
            '</div>' +
          '</div>';

        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        setTimeout(function () {
          document.getElementById('wv-toggle').addEventListener('change', async function () {
            if (this.checked) {
              document.getElementById('wv-controls').style.display = 'flex';
              document.getElementById('wv-loading').style.display = 'block';
              document.getElementById('wv-player').style.display = 'none';
              try {
                await waveLayer.loadMeta('/static/waves/wave_meta.json');
                await waveLayer.preloadAll();
                const progEl = document.getElementById('wv-progress');
                progEl.max = waveLayer.frames.length - 1;
                progEl.value = 0;
                document.getElementById('wv-loading').style.display = 'none';
                document.getElementById('wv-player').style.display = 'block';
                waveLayer.activate();
              } catch (e) {
                document.getElementById('wv-loading').textContent = 'Fehler beim Laden!';
                console.error('Wave layer error:', e);
              }
            } else {
              document.getElementById('wv-controls').style.display = 'none';
              waveLayer.deactivate();
            }
          });
          document.getElementById('wv-play-btn').addEventListener('click', function () {
            waveLayer.toggleAnim();
          });
          document.getElementById('wv-prev-btn').addEventListener('click', function () {
            waveLayer.stopAnim(); waveLayer.showFrame(waveLayer.currentFrame - 1);
          });
          document.getElementById('wv-next-btn').addEventListener('click', function () {
            waveLayer.stopAnim(); waveLayer.showFrame(waveLayer.currentFrame + 1);
          });
          document.getElementById('wv-progress').addEventListener('input', function () {
            waveLayer.stopAnim(); waveLayer.showFrame(parseInt(this.value));
          });
        }, 0);

        return container;
      }
    });
    // --- Precipitation Forecast Layer (Canvas) ---
    const precipLayer = new PrecipCanvasLayer(map);

    const PrecipControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function () {
        const container = L.DomUtil.create('div', 'leaflet-bar');
        container.style.cssText = 'background:#fff;padding:8px 12px;border-radius:6px;font-family:sans-serif;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.3);user-select:none;';
        container.innerHTML =
          '<div style="margin-bottom:6px;font-weight:bold;">' +
            '<label style="cursor:pointer;">' +
              '<input type="checkbox" id="pr-toggle" style="margin-right:5px;"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px;margin-right:3px;"><path d="M4 13.5A4.5 4.5 0 0 1 8.5 9h.3A5.5 5.5 0 0 1 19 10.5a3.5 3.5 0 0 1-.5 7H5a4.5 4.5 0 0 1-1-4z" fill="#888"/><circle cx="8" cy="20.5" r="1" fill="#555"/><circle cx="12" cy="21.5" r="1" fill="#555"/><circle cx="16" cy="20.5" r="1" fill="#555"/></svg>Niederschlagsvorhersage (GFS)' +
            '</label>' +
          '</div>' +
          '<div id="pr-controls" style="display:none;flex-direction:column;align-items:center;gap:6px;">' +
            '<div id="pr-loading" style="color:#888;">Lade Daten...</div>' +
            '<div id="pr-player" style="display:none;">' +
              '<div style="display:flex;align-items:center;gap:8px;">' +
                '<button id="pr-prev-btn" style="font-size:16px;cursor:pointer;border:none;background:none;padding:2px 6px;">\u23EE</button>' +
                '<button id="pr-play-btn" style="font-size:18px;cursor:pointer;border:none;background:none;padding:2px 8px;">\u25B6</button>' +
                '<button id="pr-next-btn" style="font-size:16px;cursor:pointer;border:none;background:none;padding:2px 6px;">\u23ED</button>' +
                '<span id="pr-label" style="min-width:140px;text-align:center;font-weight:bold;">--</span>' +
              '</div>' +
              '<input type="range" id="pr-progress" min="0" max="7" value="0" style="width:180px;cursor:pointer;">' +
            '</div>' +
          '</div>';

        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        setTimeout(function () {
          document.getElementById('pr-toggle').addEventListener('change', async function () {
            if (this.checked) {
              document.getElementById('pr-controls').style.display = 'flex';
              document.getElementById('pr-loading').style.display = 'block';
              document.getElementById('pr-player').style.display = 'none';
              try {
                await precipLayer.loadMeta('/static/precip/precip_meta.json');
                await precipLayer.preloadAll();
                const progEl = document.getElementById('pr-progress');
                progEl.max = precipLayer.frames.length - 1;
                progEl.value = 0;
                document.getElementById('pr-loading').style.display = 'none';
                document.getElementById('pr-player').style.display = 'block';
                precipLayer.activate();
              } catch (e) {
                document.getElementById('pr-loading').textContent = 'Fehler beim Laden!';
                console.error('Precip layer error:', e);
              }
            } else {
              document.getElementById('pr-controls').style.display = 'none';
              precipLayer.deactivate();
            }
          });
          document.getElementById('pr-play-btn').addEventListener('click', function () {
            precipLayer.toggleAnim();
          });
          document.getElementById('pr-prev-btn').addEventListener('click', function () {
            precipLayer.stopAnim(); precipLayer.showFrame(precipLayer.currentFrame - 1);
          });
          document.getElementById('pr-next-btn').addEventListener('click', function () {
            precipLayer.stopAnim(); precipLayer.showFrame(precipLayer.currentFrame + 1);
          });
          document.getElementById('pr-progress').addEventListener('input', function () {
            precipLayer.stopAnim(); precipLayer.showFrame(parseInt(this.value));
          });
        }, 0);

        return container;
      }
    });
    // --- Sea Surface Temperature Layer ---
    // Two modes: NASA GIBS WMTS tiles (MUR 1km, high quality) or local OISST Canvas
    const sstLayer = new SSTCanvasLayer(map);
    let sstGibsLayer = null;
    let sstMode = 'gibs'; // 'gibs' or 'oisst'

    function sstGibsActivate() {
      if (sstGibsLayer) return;
      // NASA GIBS WMTS — MUR SST 1km, pre-rendered tiles, max zoom 7
      sstGibsLayer = L.tileLayer(
        'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/GHRSST_L4_MUR_Sea_Surface_Temperature/default/{time}/GoogleMapsCompatible_Level7/{z}/{y}/{x}.png',
        {
          time: '',  // empty = latest available
          tileSize: 256,
          maxNativeZoom: 7,
          maxZoom: 18,
          opacity: 0.7,
          zIndex: 449,
          attribution: 'SST: NASA GIBS / JPL MUR'
        }
      );
      sstGibsLayer.addTo(map);
    }

    function sstGibsDeactivate() {
      if (sstGibsLayer) {
        map.removeLayer(sstGibsLayer);
        sstGibsLayer = null;
      }
    }

    async function sstOisstActivate() {
      await sstLayer.loadMeta('/static/sst/sst_meta.json');
      await sstLayer.loadGrid();
      sstLayer.activate();
    }

    function sstDeactivateAll() {
      sstGibsDeactivate();
      sstLayer.deactivate();
    }

    const SSTControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function () {
        const container = L.DomUtil.create('div', 'leaflet-bar');
        container.style.cssText = 'background:#fff;padding:8px 12px;border-radius:6px;font-family:sans-serif;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.3);user-select:none;';
        container.innerHTML =
          '<div style="margin-bottom:6px;font-weight:bold;">' +
            '<label style="cursor:pointer;">' +
              '<input type="checkbox" id="sst-toggle" style="margin-right:5px;"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px;margin-right:3px;"><rect x="10" y="2" width="4" height="14" rx="2" fill="none" stroke="#555" stroke-width="1.8"/><circle cx="12" cy="19" r="3.5" fill="none" stroke="#555" stroke-width="1.8"/><circle cx="12" cy="19" r="1.8" fill="#d33"/><rect x="11" y="9" width="2" height="8" fill="#d33"/></svg>Wassertemperatur (SST)' +
            '</label>' +
          '</div>' +
          '<div id="sst-controls" style="display:none;flex-direction:column;align-items:center;gap:6px;">' +
            '<div id="sst-loading" style="color:#888;display:none;">Lade Daten...</div>' +
            '<div id="sst-info">' +
              '<div style="display:flex;gap:6px;margin-bottom:4px;">' +
                '<label style="cursor:pointer;font-size:12px;">' +
                  '<input type="radio" name="sst-source" value="gibs" checked style="margin-right:3px;">MUR 1km (NASA)' +
                '</label>' +
                '<label style="cursor:pointer;font-size:12px;">' +
                  '<input type="radio" name="sst-source" value="oisst" style="margin-right:3px;">OISST (lokal)' +
                '</label>' +
              '</div>' +
            '</div>' +
          '</div>';

        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        setTimeout(function () {
          document.getElementById('sst-toggle').addEventListener('change', async function () {
            if (this.checked) {
              document.getElementById('sst-controls').style.display = 'flex';
              try {
                if (sstMode === 'gibs') {
                  sstGibsActivate();
                } else {
                  document.getElementById('sst-loading').style.display = 'block';
                  await sstOisstActivate();
                  document.getElementById('sst-loading').style.display = 'none';
                }
              } catch (e) {
                document.getElementById('sst-loading').textContent = 'Fehler beim Laden!';
                console.error('SST layer error:', e);
              }
            } else {
              document.getElementById('sst-controls').style.display = 'none';
              sstDeactivateAll();
            }
          });

          document.querySelectorAll('input[name="sst-source"]').forEach(function (radio) {
            radio.addEventListener('change', async function () {
              sstMode = this.value;
              // Only switch if the main toggle is on
              if (!document.getElementById('sst-toggle').checked) return;
              sstDeactivateAll();
              try {
                if (sstMode === 'gibs') {
                  document.getElementById('sst-loading').style.display = 'none';
                  sstGibsActivate();
                } else {
                  document.getElementById('sst-loading').style.display = 'block';
                  await sstOisstActivate();
                  document.getElementById('sst-loading').style.display = 'none';
                }
              } catch (e) {
                document.getElementById('sst-loading').textContent = 'Fehler beim Laden!';
                console.error('SST source switch error:', e);
              }
            });
          });
        }, 0);

        return container;
      }
    });
    // --- Mutual exclusion: only one overlay at a time ---
    const overlayDefs = [
      { id: 'pr-toggle',  off: function () { document.getElementById('pr-controls').style.display = 'none'; precipLayer.deactivate(); } },
      { id: 'nc-toggle',  off: function () { document.getElementById('nc-controls').style.display = 'none'; ncClearCache(); ncActive = false; } },
      { id: 'rv-toggle',  off: function () { document.getElementById('rv-controls').style.display = 'none'; rvStop(); rvClearCache(); rvActive = false; } },
      { id: 'sst-toggle', off: function () { document.getElementById('sst-controls').style.display = 'none'; sstDeactivateAll(); } },
      { id: 'wv-toggle',  off: function () { document.getElementById('wv-controls').style.display = 'none'; waveLayer.deactivate(); } }
    ];

    // --- Vertical color legend (shown next to active overlay) ---
    const legendData = {
      'pr-toggle': {
        gradient: 'linear-gradient(to top,#78c8ff,#3c96ff,#1464f0,#28c828,#c8e600,#ffc800,#ff7800,#e61e1e,#aa0078)',
        min: '0.2', max: '64+', unit: 'mm/h'
      },
      'nc-toggle': {
        gradient: 'linear-gradient(to top,#97d7f2,#4dc3eb,#24a5e6,#2c9b2c,#5eba2c,#c4d828,#f0e614,#f0be14,#f08228,#e65050,#c83c8c,#8c2878)',
        min: '0.1', max: '100+', unit: 'mm/h'
      },
      'rv-toggle': {
        gradient: 'linear-gradient(to top,#88ffee,#00cc00,#009900,#ffff00,#ffcc00,#ff6600,#ff0000,#cc0000,#aa00ff,#ffffff)',
        min: '0.5', max: '50+', unit: 'mm/h'
      },
      'sst-toggle': {
        gradient: 'linear-gradient(to top,#04008c,#0000dc,#0058ff,#00c4ff,#00ffc4,#fce83a,#ff7800,#ff0000,#960000)',
        min: '-2', max: '35', unit: '\u00B0C'
      },
      'wv-toggle': {
        gradient: 'linear-gradient(to top,#0a28a0,#0078d2,#00bea8,#3cc83c,#d2d200,#eb9600,#d2281e,#960050)',
        min: '0.5', max: '8+', unit: 'm'
      }
    };

    // Legend element is a fixed-position div next to the topright controls
    (function () {
      var el = document.createElement('div');
      el.id = 'overlay-legend';
      el.innerHTML =
        '<span id="legend-max"></span>' +
        '<div id="legend-bar"></div>' +
        '<span id="legend-min"></span>' +
        '<span id="legend-unit"></span>';
      document.getElementById('map').appendChild(el);
    })();

    function showLegend(toggleId) {
      var el = document.getElementById('overlay-legend');
      var data = legendData[toggleId];
      if (!el || !data) { if (el) el.style.display = 'none'; return; }
      document.getElementById('legend-bar').style.background = data.gradient;
      document.getElementById('legend-max').textContent = data.max;
      document.getElementById('legend-min').textContent = data.min;
      document.getElementById('legend-unit').textContent = data.unit;
      el.style.display = 'block';
    }

    function hideLegend() {
      var el = document.getElementById('overlay-legend');
      if (el) el.style.display = 'none';
    }

    function deactivateOtherOverlays(activeId) {
      overlayDefs.forEach(function (def) {
        if (def.id !== activeId) {
          var cb = document.getElementById(def.id);
          if (cb && cb.checked) {
            cb.checked = false;
            def.off();
          }
        }
      });
    }

    // --- Add overlay controls alphabetically (top to bottom) ---
    new PrecipControl().addTo(map);    // Niederschlagsvorhersage
    new NowcastControl().addTo(map);   // Radar-Nowcast DE+NL
    new RadarControl().addTo(map);     // Regenradar Animation
    new SSTControl().addTo(map);       // Wassertemperatur (SST)
    new WaveControl().addTo(map);      // Wellenvorhersage (GFS-Wave)

    // Wire up mutual exclusion + legend after controls are in the DOM
    setTimeout(function () {
      overlayDefs.forEach(function (def) {
        var cb = document.getElementById(def.id);
        if (cb) {
          cb.addEventListener('change', function () {
            if (this.checked) {
              deactivateOtherOverlays(def.id);
              showLegend(def.id);
            } else {
              hideLegend();
            }
          });
        }
      });
    }, 0);

    function saveMapView() {
      const center = map.getCenter();
      const zoom = map.getZoom();
      console.log("💾 Speichere Kartensicht:", center, zoom);
      localStorage.setItem('mapView', JSON.stringify({
        center: [center.lat, center.lng],
        zoom: zoom
      }));
    }

    map.on('moveend', saveMapView);

    window.map = map;
  });
</script>

  var stationNames = {{ station_names | tojson }};
</script>
<script src="/static/js/leaflet_markers.js"></script>

  setTimeout(function () {
    if (typeof markers !== 'undefined' && typeof map !== 'undefined') {
      map.addLayer(markers);
    }

      <input id="search-modal-input" type="text" placeholder="Search for tide stations..." autocomplete="off" />
      <button id="search-modal-close" type="button">&times;</button>
    </div>
    <div id="search-modal-results" class="search-modal-results"></div>
  </div>
</div>
