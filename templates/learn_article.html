<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="manifest" href="/static/manifest.webmanifest"/>
<meta name="theme-color" content="#169ca5"/>
<link rel="apple-touch-icon" href="/static/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Tides"/>
<link href="/static/css/styles.css" rel="stylesheet"/>
<style>
html, body { overflow: auto; height: auto; }
main { max-width: 820px; margin: 0 auto; padding: 0 16px; }
header #search-trigger { position: static; transform: none; top: auto; left: auto; min-width: 0; width: auto; flex: 0 1 280px; }
.crumb-home { text-decoration: none; }
.crumb-home .home-glyph { font-size: 1em; line-height: 1; margin-right: 3px; }
.article-body { font-size: 1.02em; line-height: 1.6; color: #222; }
.article-body h3 { margin-top: 1.6em; color: #169ca5; font-size: 1.1em; }
.article-body p { margin: 0.7em 0; }
.article-body ul, .article-body ol { padding-left: 1.4em; margin: 0.7em 0; }
.article-body li { margin: 0.25em 0; }
.article-body a { color: #0066cc; }
.article-body pre { background: #f4f4f4; padding: 10px 14px; border-radius: 6px; overflow-x: auto; font-size: 0.92em; }
.article-summary { font-size: 1.08em; color: #555; line-height: 1.55; font-style: italic; margin: 0.4em 0 1.4em; }
.related-section { margin-top: 2.2em; padding-top: 1em; border-top: 1px solid #eee; }
.related-section h3 { margin: 0 0 0.5em; }
.related-list { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 720px) { .related-list { grid-template-columns: 1fr 1fr; } }
.related-list li { padding: 10px 12px; border: 1px solid #e5e5e5; border-radius: 6px; background: #fafafa; }
.related-list li a { color: #0066cc; text-decoration: none; font-weight: 500; }
.related-list li p { margin: 0.2em 0 0; color: #666; font-size: 0.9em; line-height: 1.4; }
.back-to-learn { margin-top: 2em; font-size: 0.95em; }
.back-to-learn a { color: #0066cc; text-decoration: none; }
</style>
<script src="/static/js/suche.js" defer></script>
<script src="/static/js/pwa.js" defer></script>
<title>{{ article.title }} — Tide predictions</title>
<meta name="description" content="{{ article.summary }}"/>
<link rel="canonical" href="{{ request.url_root.rstrip('/') }}/learn/{{ article.slug }}/"/>
<meta property="og:type" content="article"/>
<meta property="og:title" content="{{ article.title }}"/>
<meta property="og:description" content="{{ article.summary }}"/>
<meta property="og:url" content="{{ request.url_root.rstrip('/') }}/learn/{{ article.slug }}/"/>
<meta property="og:image" content="{{ request.url_root.rstrip('/') }}/static/og-image.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:site_name" content="Tide predictions"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="{{ request.url_root.rstrip('/') }}/static/og-image.png"/>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ article.title | tojson }},
  "description": {{ article.summary | tojson }},
  "url": "{{ request.url_root.rstrip('/') }}/learn/{{ article.slug }}/",
  "mainEntityOfPage": "{{ request.url_root.rstrip('/') }}/learn/{{ article.slug }}/",
  "publisher": {
    "@type": "Organization",
    "name": "Tide predictions"
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type":"ListItem","position":1,"name":"Home","item":"{{ request.url_root.rstrip('/') }}/"},
    {"@type":"ListItem","position":2,"name":"Learn","item":"{{ request.url_root.rstrip('/') }}/learn/"},
    {"@type":"ListItem","position":3,"name":{{ article.title | tojson }},"item":"{{ request.url_root.rstrip('/') }}/learn/{{ article.slug }}/"}
  ]
}
</script>
</head>
<body>
<header style="max-width: 820px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 12px;">
<button id="search-trigger" type="button">Search for locations</button>
</header>
<nav aria-label="Breadcrumb" style="max-width:820px;margin:0 auto;padding:0 16px 6px;font-size:0.85em;color:#666;">
  <a href="/" class="crumb-home" style="color:#0066cc;" title="Back to map"><span class="home-glyph" aria-hidden="true">&#x2302;</span>Home</a>
  &rsaquo; <a href="/learn/" style="color:#0066cc;text-decoration:none;">Learn</a>
  &rsaquo; <span aria-current="page">{{ article.title }}</span>
</nav>
<main>
<article>
<h1>{{ article.title }}</h1>
<p class="article-summary">{{ article.summary }}</p>
<div class="article-body">
{{ article.body | safe }}
</div>
</article>

{% if related %}
<section class="related-section" aria-labelledby="related-heading">
  <h3 id="related-heading">Related reading</h3>
  <ul class="related-list">
    {% for r in related %}
    <li>
      <a href="/learn/{{ r.slug }}/">{{ r.title }}</a>
      <p>{{ r.summary }}</p>
    </li>
    {% endfor %}
  </ul>
</section>
{% endif %}

<p class="back-to-learn">&laquo; <a href="/learn/">Back to all Learn articles</a></p>
</main>

<script>
  var stationNames = {{ station_names | tojson }};
</script>

<div id="search-modal" class="search-modal">
  <div class="search-modal-content">
    <div class="search-modal-header">
      <input id="search-modal-input" type="text" placeholder="Search for tide stations..." autocomplete="off" />
      <button id="search-modal-close" type="button">&times;</button>
    </div>
    <div id="search-modal-results" class="search-modal-results"></div>
  </div>
</div>

</body>
</html>
